name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Thai admin text
        run: npm run check:admin-text

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Check schema.ts matches the migration history
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "schema.ts changed without a migration. Run npm run db:generate and commit the result."
            git status --porcelain -- drizzle
            exit 1
          fi
        env:
          # drizzle-kit only reads the schema here; it never connects to this URL.
          DATABASE_URL: mysql://user:pass@localhost:3306/db

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, test, required-e2e]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # Dummy env vars for build (not actual secrets)
          DATABASE_URL: mysql://user:pass@localhost:3306/db
          AUTH_SECRET: build-secret-placeholder
          NEXTAUTH_URL: http://localhost:3000
          SLIPOK_API_KEY: placeholder
          SLIPOK_BRANCH_ID: placeholder
          NEXT_PUBLIC_BANK_NAME: Bank
          NEXT_PUBLIC_BANK_ACCOUNT: xxx-x-xxxxx-x
          NEXT_PUBLIC_BANK_ACCOUNT_NAME: MilerDev
          BUNNY_STORAGE_API_KEY: placeholder
          BUNNY_STORAGE_ZONE: placeholder
          BUNNY_CDN_URL: https://placeholder.b-cdn.net

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --run

  required-e2e:
    name: Required E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: milerdev_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The merge commit and its first parent, to list what a pull request changes.
          fetch-depth: 2

      # A pull request that only touches docs/ or Markdown at the root cannot change what
      # this job tests, so it runs and passes without the database and browser steps.
      # Pushes to master, any other file, or a failed comparison run everything.
      - name: Decide whether the journeys need to run
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed="$(git diff --name-only --no-renames HEAD^1 HEAD)" || changed=""
            printf 'Changed files:\n%s\n' "$changed"
            printf '%s\n' "$changed" | node scripts/ci/docs-only-scope.mjs >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          grep '^run=' "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Configure isolated E2E environment
        if: steps.scope.outputs.run == 'true'
        shell: bash
        env:
          E2E_DB_PROTOCOL: mysql
          E2E_DB_USER: root
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: '3306'
          E2E_DB_NAME: milerdev_e2e
          E2E_APP_HOST: 127.0.0.1
          E2E_APP_PORT: '3100'
        run: |
          database_url="${E2E_DB_PROTOCOL}://${E2E_DB_USER}@${E2E_DB_HOST}:${E2E_DB_PORT}/${E2E_DB_NAME}"
          app_url="http://${E2E_APP_HOST}:${E2E_APP_PORT}"
          {
            echo "DATABASE_URL=${database_url}"
            echo "E2E_DATABASE_URL=${database_url}"
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
            echo "NEXTAUTH_URL=${app_url}"
            echo "NEXT_PUBLIC_APP_URL=${app_url}"
          } >> "$GITHUB_ENV"

      - name: Migrate isolated E2E database
        if: steps.scope.outputs.run == 'true'
        run: npm run db:migrate

      - name: Create deterministic E2E fixtures
        if: steps.scope.outputs.run == 'true'
        run: npm run db:fixtures:e2e

      - name: Verify email registration transactions on isolated MySQL
        if: steps.scope.outputs.run == 'true'
        run: npx vitest run --config vitest.mysql.config.ts

      - name: Install Chromium
        if: steps.scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run required browser journey
        if: steps.scope.outputs.run == 'true'
        run: npm run test:e2e:required

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
